[package]
name = "keemash-desktop"
version = "0.12.0"
description = "Modern KeeMASH desktop command center"
authors = ["kennet-one"]
edition = "2021"

[lib]
name = "keemash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hex = "0.4"
base64 = "0.22"
btleplug = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hmac = "0.12"
keemash-keelink = { git = "https://github.com/kennet-one/keemash_core.git", tag = "v0.7.1" }
mdns-sd = "0.17"
native-tls = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serialport = "4"
sysinfo = "0.37"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2.4.4"
tokio = { version = "1", features = ["rt", "time"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
uuid = "1"
x509-parser = "0.18"
zeroize = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
