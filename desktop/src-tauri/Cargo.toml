[package]
name = "keemash-desktop"
version = "0.2.0"
description = "Modern KeeMASH desktop command center"
authors = ["kennet-one"]
edition = "2021"

[lib]
name = "keemash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serialport = "4"
sysinfo = "0.37"
tauri = { version = "2", features = [] }
